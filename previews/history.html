<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수정 이력</title>
<style>
:root{--bg:#eef1f5;--ink:#1f2733;--sub:#5b6675;--mute:#8b96a5;--line:#d7dee7;--line2:#e7ecf2;--accent:#4f46e5;--accent-s:#eef0fe;--ok:#16a34a;--oks:#e9f7ef;--warn:#e11d48}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.top{position:sticky;top:0;z-index:10;background:#141b26;color:#fff;display:flex;align-items:center;gap:12px;padding:13px 22px}
.top .lg{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.top b{font-size:15px}
.top .tag{font-size:11px;color:#3a5ba8;background:#dbe6fb;border-radius:999px;padding:3px 10px;font-weight:700}
.top .sp{flex:1}
.top .rf{font-size:12px;color:#9fb0c4;background:none;border:1px solid #2c3a4d;border-radius:7px;padding:6px 12px}
.wrap{max-width:1000px;margin:22px auto;padding:0 20px 60px}
.intro{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 16px;font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:16px}
.intro b{color:var(--ink)}
.sumrow{display:flex;gap:10px;margin-bottom:16px}
.sum{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.sum .k{font-size:11px;color:var(--mute)}
.sum .v{font-size:22px;font-weight:800;margin-top:2px}
.sum.ok .v{color:#15803d}.sum.rej .v{color:var(--warn)}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px}
th{background:#f7f9fc;text-align:left;padding:11px 13px;font-size:11px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--sub)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.scr{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-s);border-radius:6px;padding:2px 8px;white-space:nowrap}
.who{font-weight:700;color:var(--ink)}
.badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.badge.ok{background:var(--oks);color:#15803d}
.badge.rej{background:#fdeef2;color:var(--warn)}
.badge .b{width:6px;height:6px;border-radius:50%;background:currentColor}
.lnk{color:var(--accent);text-decoration:none;font-weight:700;font-size:11px}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:50px 20px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div class="top">
  <div class="lg">R</div>
  <b>수정 이력</b>
  <span class="tag">HISTORY</span>
  <div class="sp"></div>
  <button class="rf" onclick="location.reload()">↻ 새로고침</button>
</div>
<div class="wrap">
  <div class="intro">피드백으로 만들어진 미리보기의 <b>승인 / 반려 이력</b>입니다. 무슨 내용이었고 언제 어떻게 결정됐는지 남습니다. <span style="color:var(--mute)">(대기 중인 항목은 ‘🕓 미리보기’ 탭)</span></div>
  <div class="sumrow" id="sum"></div>
  <div id="tblwrap"></div>
  <div class="foot">이 페이지는 화면설계서의 <b>‘📋 수정이력’</b> 탭에서 새 창으로 열립니다. · 적용 항목은 되돌리기(git) 가능.</div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('./queue.json?t='+Date.now()).then(r=>r.json()).then(items=>{
  const done=(items||[]).filter(x=>x.status==='applied'||x.status==='rejected')
    .sort((a,b)=>String(b.decidedDate||b.date||'').localeCompare(String(a.decidedDate||a.date||'')));
  const nOk=done.filter(x=>x.status==='applied').length, nRej=done.filter(x=>x.status==='rejected').length;
  document.getElementById('sum').innerHTML=
    `<div class="sum"><div class="k">전체 결정</div><div class="v">${done.length}</div></div>`+
    `<div class="sum ok"><div class="k">✅ 승인(적용)</div><div class="v">${nOk}</div></div>`+
    `<div class="sum rej"><div class="k">❌ 반려</div><div class="v">${nRej}</div></div>`;
  const w=document.getElementById('tblwrap');
  if(!done.length){ w.innerHTML='<div class="empty">아직 결정된 이력이 없습니다.<br>미리보기를 승인/반려하면 여기에 기록됩니다.</div>'; return; }
  w.innerHTML='<table><thead><tr><th style="width:110px">결정일</th><th style="width:130px">화면</th><th>피드백 내용</th><th>반영 제안</th><th style="width:90px">결과</th><th style="width:80px">미리보기</th></tr></thead><tbody>'+
    done.map(x=>{
      const ok=x.status==='applied';
      return `<tr>
        <td>${esc(x.decidedDate||x.date||'-')}</td>
        <td><span class="scr">${esc(x.screenLabel||x.screen||'')}</span></td>
        <td><div class="who">${esc(x.fbName||'익명')}</div>${esc(x.fbText||'')}</td>
        <td>${esc(x.proposal||'')}</td>
        <td><span class="badge ${ok?'ok':'rej'}"><span class="b"></span> ${ok?'승인·적용':'반려'}</span></td>
        <td>${x.file?`<a class="lnk" href="${esc(x.file)}" target="_blank" rel="noopener">열기 ↗</a>`:'-'}</td>
      </tr>`;}).join('')+
    '</tbody></table>';
}).catch(()=>{document.getElementById('tblwrap').innerHTML='<div class="empty">이력을 불러오지 못했습니다.</div>';});
</script>
</body>
</html>
